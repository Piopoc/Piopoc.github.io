<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.02) 10px, rgba(255,255,255,0.02) 20px);
      z-index: -1;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 5rem);
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.9;
      margin-bottom: 1.5rem;
    }
    .red-divider {
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #ff3333, transparent);
      margin: 1.5rem auto;
    }
    p {
      font-size: 1.1rem;
      font-weight: 300;
      color: #888888;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 12px 24px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-decoration: none;
      border: 2px solid #666666;
      border-left: 4px solid #ff3333;
      transition: all 0.3s ease;
    }
    .back-link:hover {
      background: #ff3333;
      border-color: #ff3333;
      transform: translateY(-2px);
    }
    .blob {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%;
      background: linear-gradient(135deg, rgba(255,51,51,0.1), rgba(255,51,51,0.03));
      filter: blur(40px);
      top: -10%;
      right: -10%;
      animation: morph 10s ease-in-out infinite;
      z-index: -1;
    }
    @keyframes morph {
      0%, 100% { border-radius: 60% 40% 70% 30% / 50% 60% 40% 50%; }
      50% { border-radius: 40% 60% 30% 70% / 60% 30% 70% 40%; }
    }
  </style>
</head>
<body>
  <div class="blob"></div>
  <div class="container">
    <h1>coming soon</h1>
    <div class="red-divider"></div>
    <p>il mio curriculum è in fase di aggiornamento. tornerò presto con una versione aggiornata!</p>
    <a href="/" class="back-link">← back to portfolio</a>
  </div>
</body>
</html>
